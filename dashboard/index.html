:root{--g:#1F5EFF;--gd:#0B1F4B;--ink:#0B1F4B;--mut:#5B6877;--bg:#F4F7FF;--ln:#E3E9F2;--bl:#1F5EFF;--ok:#12805C;--okb:#E4F5EC;--wt:#8A5A00;--wtb:#FFF3D6;--er:#B42318;--erb:#FDECEC;--wa:#25D366;--f:'Plus Jakarta Sans',system-ui,sans-serif}

.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#EAF0FF;color:var(--g);white-space:nowrap}.chip.completed{background:var(--okb);color:var(--ok)}.chip.pending,.chip.awaiting{background:var(--wtb);color:var(--wt)}.chip.failed{background:var(--erb);color:var(--er)}.chip.cancelled,.chip.off{background:#EEF1F5;color:var(--mut)}

// saved recipients (kept only in this browser, cleared on log out)
const rcGet=()=>{try{return JSON.parse(localStorage.getItem(RCK)||'[]')}catch{return[]}};
const rcAdd=(a,n)=>{try{const l=rcGet().filter(x=>x.a!==a);l.unshift({a,n:n||''});localStorage.setItem(RCK,JSON.stringify(l.slice(0,8)))}catch{}};
const recents=()=>{const m=new Map();rcGet().forEach(x=>m.set(x.a,x.n));TX.filter(x=>x.type==='out'&&x.counterparty).forEach(x=>{if(!m.has(x.counterparty))m.set(x.counterparty,'')});return[...m].slice(0,5).map(([a,n])=>({a,n}))};
// recipient lookup through the Worker (same call the app always used)
const LK=new Map();const lookup=a=>{if(LK.has(a))return LK.get(a);const p=api('/api/wallet?address='+encodeURIComponent(a));LK.set(a,p);p.catch(()=>LK.delete(a));return p};
const copyText=async t=>{try{await navigator.clipboard.writeText(t);MV.toast(MV.t('copied'))}catch{}};
const share=t=>{if(navigator.share){navigator.share({text:t}).catch(()=>{});return}window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')};
const copyBox=(box,text,shareText)=>{const c=el('code','cbox',text),r=el('div','brow');r.append(btn('s o',MV.t('copy'),()=>copyText(text),'copy'),btn('s g',MV.t('share'),()=>share(shareText||text),'share'));box.append(c,r)};
// rows
function txModal(x){const rows=[[MV.t('d_status'),el('span','chip '+x.status,MV.t('st_'+x.status))],[MV.t('amt'),el('b','',(x.type==='in'?'+':'-')+amt(x.currency,x.amount))]];if(x.counterparty)rows.push([MV.t(x.type==='in'?'from':'rv_to'),el('b','',tail(x.counterparty))]);const w=when(x);if(w)rows.push([MV.t('d_when'),el('b','',w)]);const kv=el('div','kv');rows.forEach(([k,v])=>{const d=el('div');d.append(el('span','',k),v);kv.append(d)});const b=[[MV.t('ok'),'g',()=>m.close()]];if(isWait(x))b.unshift([MV.t('chk_st'),'o',async()=>{try{const j=await api('/api/payments/'+x.id);MV.toast(MV.t('st_'+j.status))}catch(e){MV.toast(eMsg(e))}}]);const m=modal(MV.t(x.type==='in'?'tx_recv':'tx_sent'),[kv],b)}
const row=x=>{const d=el('button','tx '+(x.type==='in'?'in':'out')),m=el('div','m'),a=el('div','a'),ci=el('div','ci');d.type='button';ci.append(ico(x.type==='in'?'recv':'send'));const cp=tail(x.counterparty),w=when(x);m.append(el('b','',x.type==='in'?MV.t('tx_recv'):MV.t('tx_sent')),el('small','',[cp,w].filter(Boolean).join(' · ')));a.append(el('div','',(x.type==='in'?'+':'-')+amt(x.currency,x.amount)),el('span','chip '+x.status,MV.t('st_'+x.status)));d.append(ci,m,a);d.onclick=()=>txModal(x);return d};
const list=(box,a)=>{box.replaceChildren();if(!a.length)box.append(el('div','em',MV.t('none')));else a.forEach(x=>box.append(row(x)))};
// WhatsApp: optional, one tap
async function loadWA(){try{const j=await api('/api/wa/info');WA={loaded:true,...j};draw()}catch{}}
async function waConnect(b){if(b)b.disabled=true;try{const j=await api('/api/wa/link',{});SKIP=false;try{localStorage.removeItem(SKK)}catch{}const n=[el('p','',MV.t('wa_s2')),el('div','cd',j.code),el('p','sm',MV.t('wa_note'))],bs=[];if(j.link)bs.push([MV.t('wa_open'),'wa',()=>window.open(j.link,'_blank','noopener')]);else n.push(el('p','',MV.t('wa_nonum')));bs.push([MV.t('cancel'),'o',()=>m.close()]);const m=modal(MV.t('wa_h'),n,bs);const t=setInterval(async()=>{if(!document.body.contains(m.d)){clearInterval(t);return}await loadWA();if(WA.linked){clearInterval(t);m.close();MV.toast(MV.t('wa_done'))}},3000)}catch(x){MV.toast(eMsg(x))}if(b)b.disabled=false}
function waUnlink(){const m=modal(MV.t('wa_unq'),[el('p','',MV.t('wa_und'))],[[MV.t('cancel'),'o',()=>m.close()],[MV.t('ch_unlink'),'g',async()=>{m.close();try{await api('/api/wa/unlink',{});await loadWA()}catch(x){MV.toast(eMsg(x))}}]])}
function waCard(box){box.replaceChildren();const r=el('div','chr'),c=el('div','ci wa');c.append(ico('wa'));const t=el('div','ct');t.append(el('b','',MV.t('ch_wa')),el('small','',WA.linked?WA.phone:MV.t('ch_wad')));r.append(c,t);if(WA.linked)r.append(el('span','chip completed',MV.t('ch_link')));box.append(r);
if(WA.linked){const a=el('div','brow');if(WA.number){const l=el('a','btn s wa');l.href='https://wa.me/'+WA.number;l.target='_blank';l.rel='noopener';l.append(ico('wa'),document.createTextNode(MV.t('ch_chat')));a.append(l)}a.append(btn('s o',MV.t('ch_unlink'),waUnlink));box.append(a)}
else{box.append(el('p','hint',MV.t('wa_what')));if(WA.loaded&&!WA.enabled)box.append(el('p','hint',MV.t('wa_off')));else{const b=btn('wa',MV.t('ch_conn'),()=>waConnect(b),'wa');b.style.marginTop='12px';box.append(b)}}}
// payment account (called "Payment ID" in the interface)
function acctModal(){const inp=el('input');inp.value=P.walletAddress||'';inp.placeholder='$ilp.interledger-test.dev/yourname';inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');inp.setAttribute('aria-label',MV.t('pid'));inp.style.marginBottom='10px';
const st=el('div','rp hide'),help=el('a','lk',MV.t('acct_new'));help.href='https://wallet.interledger-test.dev';help.target='_blank';help.rel='noopener';let found=null,tm,n=0;
const chk=async()=>{const a=inp.value.trim(),my=++n;found=null;sv.disabled=true;if(!a){st.className='rp hide';return}if(!WR.test(a)){st.className='rp bad';st.textContent=MV.t('e_addr');return}st.className='rp';st.textContent=MV.t('chk');try{const w=await lookup(a);if(my!==n)return;found=w;sv.disabled=false;st.className='rp';st.textContent=tf('found',{n:w.name||nick(w.address),c:w.assetCode})}catch(x){if(my!==n)return;st.className='rp bad';st.textContent=x&&x.k==='e_net'?MV.t('e_net'):MV.t('e_bad_wallet')}};
inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(chk,450)};
const m=modal(MV.t('g1'),[el('p','',MV.t('acct_d')),inp,st,help],[[MV.t('save'),'g',async()=>{if(!found)return;sv.disabled=true;try{await updateDoc(doc(db,'users',U.uid),{walletAddress:found.address});W=found;WL=found.address;P={...P,walletAddress:found.address};m.close();MV.toast(MV.t('acct_saved'));draw()}catch{st.className='rp bad';st.textContent=MV.t('e_gen');sv.disabled=false}}],[MV.t('cancel'),'o',()=>m.close()]]);
const sv=m.r.querySelector('button');sv.disabled=true;if(inp.value)chk();setTimeout(()=>inp.focus(),50)}
// setup checklist (shown only until the basics are done)
function setup(){const box=$('#setup'),a=!!P.walletAddress,w=WA.linked||SKIP,f=TX.length>0;box.classList.toggle('hide',a&&w&&f);if(a&&w&&f)return;box.replaceChildren();
const n=[a,w,f].filter(Boolean).length,h=el('div');h.append(el('h3','',MV.t('setup_h')),el('p','hint',MV.t('setup_d')));const bar=el('div','bar'),i=el('i');i.style.width=Math.round(n/3*100)+'%';bar.append(i);box.append(h,bar);
const step=(k,done,sk,title,desc,acts)=>{const r=el('div','su'+(done?' dn':sk?' sk':'')),nm=el('div','nm');if(done)nm.append(ico('check'));else nm.textContent=k;const c=el('div','ct');c.append(el('b','',MV.t(title)),el('small','',MV.t(desc)));r.append(nm,c);const rw=el('div','rw');acts.forEach(x=>rw.append(x));if(acts.length)r.append(rw);box.append(r)};
step(1,a,0,'g1','g1d',a?[]:[btn('s g',MV.t('add_acct'),acctModal)]);
const wb=[];if(WA.linked)wb.push(el('span','chip completed',MV.t('ch_link')));else if(SKIP)wb.push(el('span','chip off',MV.t('skipped')));else{if(!(WA.loaded&&!WA.enabled)){const b=btn('s wa',MV.t('ch_conn'),()=>waConnect(b),'wa');wb.push(b)}const l=el('button','lk',MV.t('later'));l.onclick=()=>{SKIP=true;try{localStorage.setItem(SKK,'1')}catch{}draw()};wb.push(l)}
step(2,WA.linked,SKIP&&!WA.linked,'g2','g2d',wb);
step(3,f,0,'g3','g3d',(!f&&a)?[btn('s g',MV.t('send'),()=>go('send'))]:[])}
// drawing
const totals=()=>{const t={in:{},out:{}};TX.filter(x=>x.status==='completed').forEach(x=>{const k=x.type==='in'?'in':'out',c=x.currency||'';t[k][c]=(t[k][c]||0)+Number(x.amount||0)});return t};
const sumTxt=o=>{const e=Object.entries(o);return e.length?e.map(([c,v])=>amt(c,v)).join(' · '):amt(W&&W.assetCode||'',0)};
function setSteps(n){[1,2,3,4].forEach(i=>$('#st'+i).classList.toggle('on',i<=n))}
function showQ(){const r=$('#rv'),key=Q?Q.paymentId+'|'+MV.lang:'';$('#sf').classList.toggle('hide',!!Q);if(r.dataset.k===key)return;r.dataset.k=key;r.replaceChildren();if(!Q){r.classList.add('hide');setSteps(1);return}
[['rv_to',Q.receiver.name||tail(Q.receiver.address)],['pay_you',fmt(Q.debitAmount)],['pay_get',fmt(Q.receiveAmount)]].forEach(([k,v])=>{const d=el('div','r');d.append(el('span','',MV.t(k)),el('b','',v));r.append(d)});
if(Q.debitAmount.assetCode===Q.receiveAmount.assetCode){const f=Number(Q.debitAmount.value)-Number(Q.receiveAmount.value);if(f>0){const d=el('div','r');d.append(el('span','',MV.t('pay_fee')),el('b','',fmt({...Q.debitAmount,value:String(f)})));r.append(d)}}
r.append(el('p','',MV.t('approve_hint')));const row2=el('div','row2'),ed=btn('o',MV.t('edit'),()=>{Q=null;showQ()}),b=btn('g',MV.t('confirm'),async()=>{b.disabled=true;try{const j=await api('/api/send/confirm',{paymentId:Q.paymentId});location.href=j.redirect}catch(x){b.disabled=false;Q=null;showQ();$('#se').textContent=eMsg(x)}});row2.append(ed,b);r.append(row2);r.classList.remove('hide');setSteps(2)}
function recentChips(){const box=$('#rcs');box.replaceChildren();recents().forEach(x=>{const b=el('button','rcp'),a=el('span','av',ini(x.n,x.a));b.type='button';b.append(a,document.createTextNode(x.n||nick(x.a)));b.onclick=()=>{$('#sa').value=x.a;checkTo();$('#sm').focus()};box.append(b)})}
const draw=()=>{const nm=(P.name||(U&&U.displayName)||'').split(' ')[0],has=!!P.walletAddress;$('#hi').textContent=MV.t('hi')+(nm?', '+nm:'');
$('#svcbar').classList.toggle('hide',SVC!=='down');
// home
const pend=TX.filter(isWait).length,ip=$('#inprog');ip.classList.toggle('hide',!pend);if(pend)ip.textContent=tf('prog',{n:pend});
$('#hero').classList.toggle('hide',!has);if(has){$('#hn').textContent=W&&W.name?W.name:(P.name||nick(P.walletAddress));const hc=$('#hc');hc.classList.toggle('hide',!W);if(W)hc.textContent=W.assetCode;$('#hp').textContent=tail(P.walletAddress);const t=totals();$('#tin').textContent=sumTxt(t.in);$('#tout').textContent=sumTxt(t.out)}
setup();list($('#tl'),TX.slice(0,4));
// send and receive
['s','r'].forEach(k=>{$('#'+k+'gate').classList.toggle('hide',has);$('#'+k+'body').classList.toggle('hide',!has)});recentChips();showQ();
$('#cur').textContent=RC?RC.assetCode:'';$('#rcur').textContent=W?W.assetCode:'';$('#reqd').textContent=tf('req_d',{h:MV.t('hist')});
const rb=$('#rbox');rb.replaceChildren();if(has)copyBox(rb,P.walletAddress,tf('share_msg',{id:P.walletAddress}));
// history
const sub=TX.filter(x=>FL==='all'||(FL==='in'&&x.type==='in')||(FL==='out'&&x.type==='out')||(FL==='wait'&&isWait(x)));list($('#hl'),sub);
const fl=$('#fl');fl.replaceChildren();[['all','f_all'],['out','tx_sent'],['in','tx_recv'],['wait','in_wait']].forEach(([k,t])=>{const b=el('button',k===FL?'on':'',MV.t(t));b.type='button';b.onclick=()=>{FL=k;draw()};fl.append(b)});
// account
const full=P.name||(U&&U.displayName)||'';$('#av').textContent=ini(full,U&&U.email);$('#an').textContent=full||(U&&U.email)||'';$('#ae').textContent=(U&&U.email)||'';
const acs=$('#acs');acs.replaceChildren();if(has){const r=el('div','chr'),c=el('div','ci');c.append(ico('card'));const t=el('div','ct');t.append(el('b','',W&&W.name?W.name:nick(P.walletAddress)),el('small','',tail(P.walletAddress)));r.append(c,t);if(W)r.append(el('span','chip',W.assetCode));acs.append(r,btn('s o',MV.t('chg_acct'),acctModal))}else{acs.append(el('p','hint',MV.t('g1d')),btn('g',MV.t('add_acct'),acctModal));acs.lastChild.style.marginTop='12px'}
waCard($('#wa2'));
$('#so').setAttribute('aria-label',MV.t('out'));$('#hs').replaceChildren(ico('send'),document.createTextNode(MV.t('send')));$('#hr').replaceChildren(ico('recv'),document.createTextNode(MV.t('recv')));
$('#spaste').replaceChildren(ico('paste'));$('#spaste').setAttribute('aria-label',MV.t('paste'));$('#hcp').replaceChildren(ico('copy'));$('#hcp').setAttribute('aria-label',MV.t('copy'));
show(cur)};
$('#inprog').onclick=()=>{FL='wait';go('hist')};
$('#hcp').onclick=()=>P.walletAddress&&copyText(P.walletAddress);
// language buttons in Account
(()=>{const g=$('#lgrid');LS.forEach(([c,n])=>{const b=el('button','lo');b.type='button';b.dataset.l=c;const i=el('i');i.innerHTML=TR;b.append(i,document.createTextNode(n));b.onclick=()=>MV.setLang(c);g.append(b)});apply()})();
addEventListener('langchange',()=>{if(U)draw()});
addEventListener('langpick',e=>{if(U)updateDoc(doc(db,'users',U.uid),{lang:e.detail}).catch(()=>{});MV.toast(MV.t('lang_toast').replace('{n}',MV.names[e.detail]))});
async function poll(pid,n=0){try{const j=await api('/api/payments/'+pid);if(j.status==='pending'&&n<20)setTimeout(()=>poll(pid,n+1),3000);else MV.toast(MV.t('st_'+j.status))}catch{}}
function loadAcct(){if(!P.walletAddress){W=null;WL='';return}if(WL===P.walletAddress)return;WL=P.walletAddress;const a=WL;lookup(a).then(w=>{if(WL===a){W=w;draw()}}).catch(()=>{if(WL===a)WL=''})}
onAuthStateChanged(auth,async u=>{if(!u){location.replace('/auth/login/');return}
if(Date.now()-(+localStorage.getItem(K)||Date.now())>=IDLE){out(true);return}
U=u;localStorage.setItem(K,String(Date.now()));try{SKIP=localStorage.getItem(SKK)==='1'}catch{}try{await ensure(u);P=(await getDoc(doc(db,'users',u.uid))).data()||{}}catch{P={}}
if(P.lang&&P.lang!==MV.lang)MV.setLang(P.lang,true);
$('#pn').value=P.name||u.displayName||'';$('#pe').value=u.email||'';
const qs=new URLSearchParams(location.search),pay=qs.get('pay');if(pay){history.replaceState(null,'','/dashboard/#hist');if(qs.get('err'))MV.toast(MV.t('e_op'));else if(qs.get('cancelled'))MV.toast(MV.t('st_cancelled'));else poll(pay)}
cur=location.hash.slice(1)||'home';draw();loadWA();svc();loadAcct();
// live profile: a language, account or WhatsApp change made on the other channel appears here at once
onSnapshot(doc(db,'users',u.uid),s=>{const d=s.data();if(!d)return;const was=P.whatsapp;P=d;if(P.lang&&P.lang!==MV.lang)MV.setLang(P.lang,true);if(was!==P.whatsapp)loadWA();loadAcct();draw()});
onSnapshot(query(collection(db,'users',u.uid,'transactions'),orderBy('createdAt','desc'),limit(50)),s=>{TX=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{TX=[];draw()});
setTimeout(()=>TX.filter(x=>x.status==='pending').slice(0,5).forEach(x=>api('/api/payments/'+x.id).catch(()=>{})),1500)});
// send
let tm=0,LKT=0;
async function checkTo(){const a=$('#sa').value.trim(),rp=$('#rp'),my=++LKT;RC=null;$('#cur').textContent='';if(!a||!WR.test(a)){rp.className='rp hide';return}rp.className='rp';rp.replaceChildren(document.createTextNode(MV.t('chk')));
try{const w=await lookup(a);if(my!==LKT)return;RC=w;$('#cur').textContent=w.assetCode;const av=el('span','av',ini(w.name,w.address)),c=el('div','ct');c.append(el('b','',w.name||nick(w.address)),el('small','',tail(w.address)));rp.replaceChildren(av,c,el('span','chip',w.assetCode))}catch(x){if(my!==LKT)return;rp.className='rp bad';rp.textContent=x&&x.k==='e_net'?MV.t('e_net'):MV.t('e_bad_wallet')}}
$('#sa').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(checkTo,450)});
$('#spaste').onclick=async()=>{try{const t=(await navigator.clipboard.readText()).trim();if(t){$('#sa').value=t;checkTo()}}catch{$('#sa').focus()}};
$('#sf').onsubmit=async e=>{e.preventDefault();const a=$('#sa').value.trim(),m=$('#sm').value.replace(/,/g,'').trim();$('#se').textContent='';Q=null;showQ();
if(!WR.test(a)){$('#se').textContent=MV.t('e_addr');return}if(!/^\d{1,9}(\.\d{1,9})?$/.test(m)||!(parseFloat(m)>0)){$('#se').textContent=MV.t('e_amt');return}
const nrm=v=>String(v).replace(/^\$/,'https://').replace(/\/+$/,'').toLowerCase();if(W&&nrm(RC?RC.address:a)===nrm(W.address)){$('#se').textContent=MV.t('e_self');return}
$('#sb').disabled=true;try{Q=await api('/api/send/quote',{receiver:a,amount:m});rcAdd(Q.receiver.address,Q.receiver.name);showQ()}catch(x){$('#se').textContent=eMsg(x)}$('#sb').disabled=false};
// receive
$('#rf').onsubmit=async e=>{e.preventDefault();$('#re').textContent='';$('#ro').replaceChildren();const m=$('#rm').value.replace(/,/g,'').trim();if(!/^\d{1,9}(\.\d{1,9})?$/.test(m)||!(parseFloat(m)>0)){$('#re').textContent=MV.t('e_amt');return}try{const j=await api('/api/receive',{amount:m});copyBox($('#ro'),j.url,tf('share_req',{u:j.url}))}catch(x){$('#re').textContent=eMsg(x)}};
// profile (name only; the payment account has its own screen)
$('#pf').onsubmit=async e=>{e.preventDefault();const n=$('#pn').value.trim().slice(0,80);$('#pr').textContent='';$('#po').classList.add('hide');try{await updateDoc(doc(db,'users',U.uid),{name:n});P={...P,name:n};$('#po').classList.remove('hide');draw()}catch{$('#pr').textContent=MV.t('e_gen')}};
const off=()=>$('#off').classList.toggle('hide',navigator.onLine);addEventListener('online',off);addEventListener('offline',off);off();
