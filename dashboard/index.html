<style>
:root{--sw:264px;--paper:#F6F2EC;--card:#FFFFFF;--text:#1F1D1B;--ink:#1F1D1B;--mute:#6B665F;--line:#E4DDD2;--surface:#2A2623;--side-text:#D9D2C7;--coral:#E5594F;--coral-d:#C9443B;--btn:#2A2623;--btn-h:#161412;--btn-text:#FFFFFF;--track:#E6DFD4;--err:#B3261E;--err-bg:#FBE9E7;--ok:#2E7D4F;--ok-bg:#E6F2EA;--me-bg:#FDEEEB;--alt:#EFE9DF;--hero-a:#3A3430;--hero-b:#2A2623;--shadow:0 1px 2px rgba(40,30,20,.04),0 8px 22px rgba(40,30,20,.06);color-scheme:light}
html[data-theme="dark"]{--paper:#2A2723;--card:#34312C;--text:#EEE8DE;--ink:#EEE8DE;--mute:#B5AEA2;--line:#48433D;--surface:#232120;--side-text:#D3CCC1;--btn:#EEE8DE;--btn-h:#FFFFFF;--btn-text:#1F1D1B;--track:#48433D;--err:#F5958D;--err-bg:#4A2E2B;--ok:#7CCB9A;--ok-bg:#2A4033;--me-bg:#4A332F;--alt:#302D29;--coral-d:#F27A70;--hero-a:#443D37;--hero-b:#332E2A;--shadow:0 1px 2px rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.16);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(80px + env(safe-area-inset-top))}
body{margin:0;font-family:"Instrument Sans",system-ui,sans-serif;background:var(--paper);color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.12;letter-spacing:-.012em}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);z-index:40;background:var(--surface);color:#F6F2EC;padding:20px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid rgba(255,255,255,.05);transition:transform .24s cubic-bezier(.4,0,.2,1),visibility 0s}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 22px}
.brand{display:flex;align-items:center;gap:12px;font:700 20px "Bricolage Grotesque",sans-serif;min-width:0}
.brand img,.mini img{width:40px;height:40px;object-fit:cover;background:#FFFFFF;border-radius:50%;flex:none}
.who{padding:0 14px 16px;color:#B9B3AA;font-size:13px;overflow-wrap:anywhere}
.side-close{display:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:none;color:var(--side-text);place-items:center;padding:0;flex:none}
.side-close svg{width:18px;height:18px}
nav{display:grid;gap:4px}
nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;color:var(--side-text);font-weight:500;transition:background .15s,color .15s}
nav a .ico{width:20px;height:20px;flex:none;opacity:.85}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a[aria-current="page"]{background:rgba(229,89,79,.2);color:#fff}
nav a[aria-current="page"] .ico{color:#FFB3AB;opacity:1}
.badge{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.signout{margin-top:auto;background:none;border:1px solid rgba(255,255,255,.16);color:var(--side-text);border-radius:12px;min-height:44px;transition:border-color .15s,color .15s}
.signout:hover{border-color:var(--coral);color:#fff}
nav+.signout{margin-top:auto}
.scrim{display:none}
.stage{margin-left:var(--sw);min-width:0;min-height:100vh;transition:margin-left .24s cubic-bezier(.4,0,.2,1)}
html.nav-closed .side{transform:translateX(-100%);visibility:hidden;transition:transform .24s cubic-bezier(.4,0,.2,1),visibility 0s .24s}
html.nav-closed .stage{margin-left:0}
.apptop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:calc(64px + env(safe-area-inset-top));padding:env(safe-area-inset-top) clamp(16px,3.6vw,44px) 0;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.apptop .grow{flex:1}
.menu-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:inline-grid;place-items:center;padding:0;flex:none;box-shadow:var(--shadow);transition:border-color .15s,background .15s}
.menu-btn:hover{border-color:var(--coral)}
.bars{display:grid;gap:5px;width:22px}
.bars i{display:block;height:2.5px;border-radius:2px;background:currentColor}
.mini{display:none;align-items:center;gap:10px;font:700 18px "Bricolage Grotesque",sans-serif}
.mini img{width:34px;height:34px;border:1px solid var(--line)}
html.nav-closed .mini{display:flex}
.theme{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.theme:hover{border-color:var(--mute)}
.theme svg{width:18px;height:18px}.theme .sun{display:none}html[data-theme="dark"] .theme .sun{display:block}html[data-theme="dark"] .theme .moon{display:none}
main{padding:clamp(8px,1.6vw,16px) clamp(16px,3.6vw,44px) clamp(28px,4vw,56px);max-width:1120px;width:100%;margin-inline:auto}
h1{font-size:clamp(28px,4vw,40px);margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 28px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}.top .sub{margin:4px 0 0}
h2{font-size:21px;margin:30px 0 14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}.sec h2{margin:0}
.more{font-size:14px;font-weight:600;color:var(--coral-d)}.more:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;background:var(--btn);color:var(--btn-text);transition:background .15s,border-color .15s;text-align:center}
.btn:hover:not(:disabled){background:var(--btn-h)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.coral{background:var(--coral);color:#fff}.btn.coral:hover:not(:disabled){background:var(--coral-d)}
.btn.line{background:var(--card);color:var(--text);border-color:var(--line)}.btn.line:hover:not(:disabled){border-color:var(--mute);background:var(--card)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 30px/1.05 "Bricolage Grotesque",sans-serif;margin-bottom:6px}.stat span{color:var(--mute);font-size:14px;line-height:1.35}
.list{display:grid;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;flex-wrap:wrap}
a.row:hover{border-color:var(--coral);transform:translateY(-1px)}
.row .grow,.grow{flex:1;min-width:0}.row .grow{min-width:200px}
.row .t,.t{font-weight:600;overflow-wrap:anywhere}.row .m,.m{color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pct{font:700 18px "Bricolage Grotesque",sans-serif;color:var(--mute);flex:none}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:10px;min-width:140px}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px}
.empty,.state{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:32px 24px;text-align:center;color:var(--mute)}
.state{margin-bottom:20px}.state h3{color:var(--text);margin-bottom:8px;font-size:22px}.state .btn{margin-top:16px}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--coral-d);border-color:var(--coral)}.pill.new{background:var(--coral);color:#fff;border-color:var(--coral)}
label{display:grid;gap:6px;font-size:14px;font-weight:500}
input,select,textarea{font:inherit;padding:12px 14px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;padding:0}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.form{display:grid;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}.chk input{width:20px;height:20px;accent-color:var(--coral)}
.msg{padding:11px 14px;border-radius:12px;font-size:14px;margin:12px 0}
.msg.error{background:var(--err-bg);color:var(--err)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.overlay{position:fixed;inset:0;background:rgba(20,18,16,.55);display:grid;place-items:center;padding:16px;z-index:70;overflow:auto}
.modal{background:var(--card);border-radius:20px;padding:24px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(760px,100%)}.modal h3{font-size:22px;margin-bottom:12px}
.modal p{color:var(--mute);font-size:14px;margin:0 0 18px;overflow-wrap:anywhere}
.modal .acts,.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface);color:#fff;padding:12px 18px;border-radius:12px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.error{background:#B3261E}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:r .7s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--track),var(--alt),var(--track));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px;min-height:20px}
@keyframes sk{to{background-position:-200% 0}}
body.login .side,body.login .apptop,body.login .scrim{display:none}body.login .stage{margin:0}body.login main{max-width:none;padding:0}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.login-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;font:700 22px "Bricolage Grotesque",sans-serif}
.login-head img{width:46px;height:46px;border-radius:50%;background:#FFFFFF;object-fit:cover;border:1px solid var(--line)}
.login-title{font:800 clamp(28px,6vw,34px)/1.05 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
.login-sub{color:var(--mute);font-size:14px;margin:0 0 24px}
@media (max-width:768px){
  .stage{margin-left:0}
  .side{width:min(300px,86vw);transform:translateX(-100%);visibility:hidden;box-shadow:none;transition:transform .24s cubic-bezier(.4,0,.2,1),visibility 0s .24s}
  html.nav-open .side{transform:none;visibility:visible;box-shadow:12px 0 40px rgba(0,0,0,.35);transition:transform .24s cubic-bezier(.4,0,.2,1),visibility 0s}
  .side-close{display:inline-grid}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(15,13,12,.5);opacity:0;pointer-events:none;transition:opacity .24s}
  html.nav-open .scrim{opacity:1;pointer-events:auto}
  html.nav-open{overflow:hidden}
  .mini{display:flex}
  .two{grid-template-columns:1fr}
  .modal{padding:18px}
  .row{align-items:flex-start}
}
@media (max-width:420px){.apptop{gap:10px}.stats{grid-template-columns:1fr 1fr;gap:12px}.stat b{font-size:26px}}
@media (prefers-reduced-motion:reduce){.side,.stage,.scrim{transition:none!important}.spin,.sk{animation-duration:2s}a.row:hover{transform:none}}

.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:clamp(22px,3.4vw,36px);border-radius:22px;color:#F6F2EC;margin-bottom:20px;background:radial-gradient(520px 260px at 100% 0%,rgba(229,89,79,.28),transparent 70%),linear-gradient(135deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow)}
.hero h1{color:#fff;margin:6px 0 8px;font-size:clamp(28px,4.2vw,42px)}
.hero-date{display:block;font:600 12.5px "Instrument Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#E0B9B3}
.hero-line{margin:0;color:#D6CFC4;font-size:16px;max-width:40ch}
.clock{text-align:right;padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);min-width:190px}
.clock-row{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;font-variant-numeric:tabular-nums}
.clock-hm{font:800 40px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;color:#fff}
.clock-s{font:600 18px "Bricolage Grotesque",sans-serif;color:#CFC8BD}
.clock-ap{font:600 13px "Instrument Sans",sans-serif;color:#E0B9B3;margin-left:2px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center}
.stat .chip{grid-row:1/3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(229,89,79,.12);color:var(--coral-d)}
.stat .chip .ico{width:22px;height:22px}
.stat b{margin-bottom:0}
.callout{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#F6F2EC;border-radius:18px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px;box-shadow:var(--shadow)}
.callout strong{font:700 18px "Bricolage Grotesque",sans-serif}.callout p{margin:4px 0 0;color:#CFC8BD}
form.grid{display:grid;gap:14px;max-width:460px}
.check{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:56px}
.check input{width:22px;height:22px;accent-color:var(--coral);flex:none}.check label{display:block;flex:1;cursor:pointer}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.player iframe,.player>div,.player video{position:absolute;inset:0;width:100%;height:100%}.player video{background:#000;object-fit:contain}
.meter{position:relative;height:12px;background:var(--track);border-radius:99px;margin:18px 0 8px}

.meter b{position:absolute;left:70%;top:-5px;bottom:-5px;width:2px;background:var(--text)}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}

.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;min-height:48px;cursor:pointer}

.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.why{font-size:14px;color:var(--mute);margin-top:8px}
.crumb{display:inline-block;color:var(--mute);font-size:14px;margin-bottom:14px}.crumb:hover{color:var(--text)}
.rank{width:34px;font:700 18px "Bricolage Grotesque",sans-serif;color:var(--mute)}
.row.me{border-color:var(--coral);background:var(--me-bg)}
.banner{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface);color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.banner button{background:var(--coral);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600}
.search{display:flex;gap:10px;margin-bottom:20px}.search input{flex:1;min-width:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;color:inherit;transition:border-color .15s,transform .15s}
.vcard:hover{border-color:var(--coral);transform:translateY(-2px)}
.vthumb{position:relative;aspect-ratio:16/9;background:var(--track)}.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.25),transparent 50%)}
.vbody{padding:12px 14px 14px;display:grid;gap:4px}
.vtitle{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px 0 4px;flex-wrap:wrap}
.pager span{color:var(--mute);font-size:14px;min-width:80px;text-align:center}
.vplayer{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px}.vplayer iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:768px){.stats{grid-template-columns:1fr}.hero{align-items:flex-start}.clock{text-align:left;width:100%}.clock-row{justify-content:flex-start}.search{flex-wrap:wrap}.search .btn{flex:1}.vgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}

/* assessments */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--coral)}
.acard{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.acard .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:0 0 18px}
.rules div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.rules b{display:block;font:700 20px "Bricolage Grotesque",sans-serif}.rules span{font-size:13px;color:var(--mute)}
.exam-bar{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.exam-bar .grow{min-width:140px}
.timer{font:800 24px/1 "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:12px;background:var(--alt)}
.timer.low{background:var(--err-bg);color:var(--err)}
.save-state{font-size:13px;color:var(--mute)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
.navgrid{position:sticky;top:calc(150px + env(safe-area-inset-top));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.navgrid .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.navgrid button{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--text);font-weight:600;font-size:14px;position:relative}
.navgrid button.done{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.navgrid button[aria-current=true]{outline:2px solid var(--coral);outline-offset:1px}
.legend{display:grid;gap:4px;font-size:12.5px;color:var(--mute)}
.qpanel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,24px);box-shadow:var(--shadow);display:grid;gap:14px}
.qpanel .qtext{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.qpanel .opt input[type=checkbox]{accent-color:var(--coral);width:20px;height:20px;flex:none}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.score b{font:800 46px/1 "Bricolage Grotesque",sans-serif}
.ans{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.files{display:grid;gap:8px;margin-top:14px}
.file{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.file .grow{min-width:0}.file .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vthumb .ph{position:absolute;inset:0;display:block;padding:12px 14px;font:700 15px "Bricolage Grotesque",sans-serif;color:var(--mute);background:var(--alt)}
.upnext .ph{display:grid;place-items:center;padding:0;font:700 13px "Bricolage Grotesque",sans-serif;color:var(--mute)}
.vthumb .play{position:absolute;left:50%;top:50%;z-index:2;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(20,18,16,.72);display:grid;place-items:center;transition:background .15s,transform .15s}
.vthumb .play svg{width:22px;height:22px;margin-left:3px;fill:#fff}
.vcard:hover .play{background:var(--coral);transform:scale(1.06)}
.vthumb .dur{position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(0,0,0,.78);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.vthumb .seen{position:absolute;left:0;right:0;bottom:0;z-index:2;height:4px;background:rgba(255,255,255,.35)}.vthumb .seen i{display:block;height:100%;background:var(--coral)}
.lcard .vbody{gap:6px}.lcard .foot2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.upnext{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:18px;box-shadow:var(--shadow)}
.upnext img,.upnext .ph{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--alt);flex:none}
a.acard{transition:border-color .15s,transform .15s}a.acard:hover{border-color:var(--coral);transform:translateY(-1px)}
@media (max-width:860px){.exam{grid-template-columns:1fr}.navgrid{position:static;order:-1}.navgrid .cells{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where, orderBy, limit, getCount as getCountFromServer, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-lite.js";

const app = initializeApp({
  apiKey: "AIzaSyCxo7KKQcDU8XcCUr2UeA_BMvltt3Wa-s4", authDomain: "mlms-f0a33.firebaseapp.com", projectId: "mlms-f0a33",
  storageBucket: "mlms-f0a33.firebasestorage.app", messagingSenderId: "49900030486",
  appId: "1:49900030486:web:f4cf36a539f2b64182c337", measurementId: "G-JLSHYC96XB"
});
const auth = getAuth(app);
const db = getFirestore(app);
const WORKER_URL = ((document.querySelector('meta[name="mlms-worker"]') || {}).content || "").replace(/\/$/, "");
const HINT = "mlms-session", DAY = 864e5, SESSION_DAYS = 30;
const setHint = (role) => { try { localStorage.setItem(HINT, JSON.stringify({ r: role, t: Date.now() })); } catch (e) {} };
const clearHint = () => { try { localStorage.removeItem(HINT); } catch (e) {} };
// Backend calls go to the free Vercel function at /api/call (no Firebase Functions SDK, so nothing extra to download).
async function apiCall(name, data, user) {
  const u = user || auth.currentUser;
  if (!u) throw Object.assign(new Error("Sign in required."), { code: "functions/unauthenticated" });
  const token = await u.getIdToken();
  let res;
  try { res = await fetch("/api/call", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify({ name, data }) }); }
  catch (e) { throw Object.assign(new Error("Network error. Check your connection and try again."), { code: "functions/unavailable" }); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const err = body.error || {}; throw Object.assign(new Error(err.message || "Something went wrong. Please try again."), { code: `functions/${err.code || "internal"}` }); }
  return body.result;
}
// Short lived in-memory cache so moving between pages does not refetch unchanged data.
const memo = new Map();
const cached = (key, ttl, fn) => { const hit = memo.get(key); if (hit && Date.now() - hit.t < ttl) return hit.v; const v = fn().catch((e) => { memo.delete(key); throw e; }); memo.set(key, { t: Date.now(), v }); return v; };
const WRITES = new Set(["registerCourses", "submitQuiz", "completeLessonWithoutQuiz", "syncLeaderboardName"]);
const call = (name) => async (data) => { const out = await apiCall(name, data); if (WRITES.has(name)) memo.clear(); return out; };
const api = ["registerCourses", "reportWatch", "getQuiz", "submitQuiz", "completeLessonWithoutQuiz", "syncLeaderboardName"]
  .reduce((acc, name) => ({ ...acc, [name]: call(name) }), {});

// Assessments, lesson files and the assessment leaderboard are served by the MLMS Worker.
async function sapi(action, data = {}, opts = {}) {
  if (!WORKER_URL) throw Object.assign(new Error("The assessment service is not set up yet."), { code: "not_configured" });
  const u = auth.currentUser;
  if (!u) throw Object.assign(new Error("Sign in required."), { code: "unauthorized" });
  const send = async (token) => fetch(`${WORKER_URL}/student/api`, { method: "POST", keepalive: !!opts.keepalive, headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify({ action, data }) });
  let res;
  try { res = await send(await u.getIdToken()); if (res.status === 401) res = await send(await u.getIdToken(true)); }
  catch (e) { throw Object.assign(new Error("No connection. Check your network and try again."), { code: "network" }); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const err = body.error || {}; throw Object.assign(new Error(err.message || "Something went wrong. Please try again."), { code: err.code || String(res.status), status: res.status }); }
  return body.result;
}
const myAssessments = () => cached("assessments", 30000, () => sapi("listAssessments"));
function paintOpenBadge(items) {
  const n = (items || []).filter((a) => a.state === "open" && (a.inProgressId || a.attemptsUsed < a.maxAttempts)).length;
  const b = document.getElementById("openA");
  if (b) { b.textContent = n; b.hidden = n === 0; }
}

const reportError = (() => {
  let sent = 0;
  return (source, error) => {
    if (sent >= 5 || !auth.currentUser) return;
    sent += 1;
    call("logClientError")({ message: String((error && error.message) || error), source, page: location.pathname, stack: String((error && error.stack) || "") }).catch(() => {});
  };
})();
window.addEventListener("error", (e) => reportError("error", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => reportError("promise", e.reason));
const WEEKS = 13;
const LEVELS = [100, 200, 300, 400, 500];
// Matric number and Telegram number are required. These match the sign-up page and the Firestore rules.
// Matric numbers look like 22CM031466. Level and matric number can only be changed by an admin.
const MATRIC_RE = /^[0-9]{2}[A-Z]{2}[0-9]{6}$/;
const cleanPhone = (v) => String(v || "").trim().replace(/[\s().-]/g, "");
const goodPhone = (v) => /^\+?\d{10,15}$/.test(v);
const hasPhone = (v) => typeof v === "string" && /^\+?[0-9][0-9 -]{6,19}$/.test(v);
const profileComplete = (p) => !!p && LEVELS.includes(p.level) && typeof p.fullName === "string" && p.fullName.trim().length >= 2 && typeof p.matricNo === "string" && MATRIC_RE.test(p.matricNo) && hasPhone(p.telegram);
// The matric number must be recorded as belonging to this account (matricNumbers/<matric>). Checked once per browser session.
async function ownsMatric(uid, matric) {
  const key = `mlms-matric:${uid}`;
  try { if (sessionStorage.getItem(key) === matric) return true; } catch (e) {}
  try {
    const snap = await getDoc(doc(db, "matricNumbers", matric));
    const mine = snap.exists() && snap.data().uid === uid;
    if (mine) { try { sessionStorage.setItem(key, matric); } catch (e) {} }
    return mine;
  } catch (e) { return false; } // another account owns it
}
const view = document.getElementById("app");
const state = { user: null, profile: null, term: null, regs: [], courses: new Map(), notices: [], read: new Set(), token: "", teardown: null };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const mount = (...nodes) => view.replaceChildren(...nodes.flat().filter((n) => n != null && n !== false));
const fmtDate = (ts) => (ts && ts.toDate ? ts.toDate() : new Date(ts)).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Africa/Lagos" });
const fmtWhen = (ts) => (ts && ts.toDate ? ts.toDate() : new Date(ts)).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Africa/Lagos" });
const fileSize = (b) => (!b ? "" : b >= 1024 ** 2 ? `${(b / 1024 ** 2).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);
const firstName = () => state.profile.fullName.trim().split(/\s+/)[0];
const boardId = () => `${state.profile.level}_${String(state.term.session).replace("/", "-")}_${state.term.semester}`;
const pctText = (fraction) => `${Math.floor(fraction * 100)}%`;

function linkify(text) {
  return text.split(/(https?:\/\/[^\s]+)/g).map((part, i) =>
    i % 2 ? h("a", { href: part, target: "_blank", rel: "noopener noreferrer", style: "color:var(--coral-d);text-decoration:underline" }, part) : part);
}

function stateBox(title, text, action) {
  return h("div", { class: "state" }, h("h3", null, title), text ? h("p", { style: "margin:0" }, text) : null, action || null);
}
const link = (href, label, cls = "btn") => h("a", { class: cls, href, "data-link": true }, label);

function greeting() {
  const hour = Number(new Intl.DateTimeFormat("en-GB", { hour: "numeric", hour12: false, timeZone: "Africa/Lagos" }).format(new Date())) % 24;
  const part = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const lines = ["Ready to pick up where you left off?", "Let's make this week count.", "A little progress today goes a long way.", "Your courses are waiting."];
  return { title: `${part}, ${firstName()}`, line: lines[new Date().getDate() % lines.length] };
}

const ts = (ms) => ({ seconds: Math.floor(ms / 1000), toMillis: () => ms, toDate: () => new Date(ms) });
const pack = (o) => JSON.parse(JSON.stringify(o, (k, v) => (v && typeof v.toMillis === "function" ? { __ts: v.toMillis() } : v)));
const unpack = (o) => JSON.parse(JSON.stringify(o), (k, v) => (v && typeof v === "object" && "__ts" in v ? ts(v.__ts) : v));
const coreKey = () => `mlms-core:${state.user.uid}`;
function readCore() {
  try { const c = JSON.parse(localStorage.getItem(coreKey()) || "null"); if (!c || Date.now() - c.t > 7 * DAY) return null; return unpack(c.v); } catch (e) { return null; }
}
function applyCore(c) {
  state.term = c.term; state.regs = c.regs; state.courses = new Map(c.courses.map((x) => [x.id, x]));
}
async function fetchCore() {
  const [termSnap, regSnap] = await Promise.all([
    getDocs(query(collection(db, "registrationWindows"), orderBy("opensAt", "desc"), limit(1))),
    getDocs(query(collection(db, "registrations"), where("uid", "==", state.user.uid)))
  ]);
  const term = termSnap.empty ? null : { id: termSnap.docs[0].id, ...termSnap.docs[0].data() };
  const regs = regSnap.docs.map((d) => d.data()).filter((r) => !term || (r.session === term.session && r.semester === term.semester));
  const courseDocs = await Promise.all(regs.map((r) => getDoc(doc(db, "courses", r.courseId))));
  const courses = courseDocs.filter((d) => d.exists()).map((d) => ({ id: d.id, ...d.data() }));
  try { localStorage.setItem(coreKey(), JSON.stringify({ t: Date.now(), v: pack({ term, regs, courses }) })); } catch (e) {}
  return { term, regs, courses };
}

function windowOpen() {
  if (!state.term) return false;
  const now = Date.now();
  return now >= state.term.opensAt.toMillis() && now <= state.term.closesAt.toMillis();
}

async function loadNotices() {
  const base = [where("status", "==", "active")];
  const queries = [
    getDocs(query(collection(db, "announcements"), ...base, where("audienceType", "==", "everyone"))),
    getDocs(query(collection(db, "announcements"), ...base, where("audienceType", "==", "level"), where("audienceRef", "==", state.profile.level)))
  ];
  const ids = [...state.courses.keys()];
  for (let i = 0; i < ids.length; i += 30) {
    queries.push(getDocs(query(collection(db, "announcements"), ...base, where("audienceType", "==", "course"), where("audienceRef", "in", ids.slice(i, i + 30)))));
  }
  const [results, reads] = await Promise.all([Promise.all(queries), getDocs(query(collection(db, "announcementReads"), where("uid", "==", state.user.uid)))]);
  const unique = new Map();
  results.forEach((snap) => snap.docs.forEach((d) => unique.set(d.id, { id: d.id, ...d.data() })));
  const now = Date.now();

async function lesson(id) {
  const snap = await getDoc(doc(db, "lessons", id));
  if (!snap.exists() || snap.data().status !== "published") return mount(stateBox("Lesson not found", "This lesson is not available.", link("/dashboard/courses", "Back to courses")));
  const L = { id, ...snap.data() };
  const c = state.courses.get(L.courseId);
  const autoplay = new URLSearchParams(location.search).get("play") === "1";
  if (autoplay) history.replaceState({}, "", location.pathname);
  const version = L.videoVersion || 1;
  const needFiles = L.videoSource === "drive" || (L.resources || []).length > 0;
  const [progressSnap, doneSnap, attemptsSnap, files] = await Promise.all([
    getDoc(doc(db, "watchProgress", `${state.user.uid}_${id}`)), getDoc(doc(db, "lessonCompletions", `${state.user.uid}_${id}`)),
    getDocs(query(collection(db, "quizAttempts"), where("uid", "==", state.user.uid), where("lessonId", "==", id))),
    needFiles ? sapi("lessonFiles", { lessonId: id }).catch((e) => ({ error: e })) : null]);
  const saved = progressSnap.exists() && progressSnap.data().videoVersion === version ? progressSnap.data() : null;
  const wasReset = progressSnap.exists() && !saved;
  const total = Math.ceil(L.videoDurationS / 5);
  const watched = new Set(saved ? saved.segments : []);
  const pending = new Set();
  let completed = doneSnap.exists();
  let best = attemptsSnap.docs.reduce((m, d) => Math.max(m, d.data().scorePct), -1);
  let player = null, tick = null, playing = false, lastNote = "";

  const fill = h("i", { style: "width:0" });
  const pctLabel = h("strong");
  const note = h("div", { class: "m" });
  const quizBox = h("div");
  const fraction = () => watched.size / total;
  const paint = () => {
    fill.style.width = `${Math.min(fraction() * 100, 100)}%`;
    pctLabel.textContent = pctText(fraction());
    note.textContent = fraction() >= 0.7 ? "You have watched enough to unlock the quiz." : "Watch 70% of the video to unlock the quiz. Skipped parts do not count.";
    drawQuiz();
  };

  async function flush(keepalive = false) {
    if (!pending.size) return;
    const body = { lessonId: id, segments: [...pending].slice(0, 60), position: player ? Math.floor(player.getCurrentTime()) : 0, rate: player ? player.getPlaybackRate() : 1 };
    body.segments.forEach((s) => pending.delete(s));
    try {
      if (keepalive) {
        fetch("/api/call", { method: "POST", keepalive: true,
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${state.token}` }, body: JSON.stringify({ name: "reportWatch", data: body }) });
        return;
      }
      const res = await api.reportWatch(body);
      watched.clear(); res.segments.forEach((s) => watched.add(s)); pending.forEach((s) => watched.add(s));
      paint();
    } catch (e) { console.error(e); body.segments.forEach((s) => pending.add(s)); }
  }

  const stopTick = () => { clearInterval(tick); tick = null; };
  const startTick = () => {
    stopTick();
    tick = setInterval(() => {
      if (!playing || document.hidden || player.getPlaybackRate() > 2) return;
      const seg = Math.floor(player.getCurrentTime() / 5);
      if (seg >= 0 && seg < total && !watched.has(seg)) { watched.add(seg); pending.add(seg); paint(); }
    }, 1000);
  };
  const reportTimer = setInterval(() => flush(), 15000);
  const onHide = () => { if (document.hidden) flush(true); };
  const onUnload = () => flush(true);
  document.addEventListener("visibilitychange", onHide);
  window.addEventListener("pagehide", onUnload);
  state.teardown = () => {
    stopTick(); clearInterval(reportTimer);
    document.removeEventListener("visibilitychange", onHide); window.removeEventListener("pagehide", onUnload);
    flush(true); try { player && player.destroy(); } catch (e) { /* player already gone */ }
  };

  function drawQuiz() {
    quizBox.replaceChildren();
    if (!L.hasQuiz) {
      const btn = h("button", { class: "btn coral", type: "button", disabled: completed || fraction() < 0.7 }, completed ? "Lesson completed" : "Complete lesson");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try { await flush(); await api.completeLessonWithoutQuiz({ lessonId: id }); completed = true; paint(); } catch (e) { btn.disabled = false; quizBox.append(h("div", { class: "msg error" }, e.message)); }
      });

  const setAnswer = (v) => { answers[qs[cur].id] = v; dirty = true; keep(); drawNav(); saveEl.textContent = "Not saved yet"; };

  function drawQ() {
    const qq = qs[cur], v = answers[qq.id];
    let control;
    if (qq.type === "mcq") control = qq.options.map((o) => h("label", { class: "opt" }, h("input", { type: "radio", name: "ans", checked: v === o.id, onchange: () => setAnswer(o.id) }), o.text));
    else if (qq.type === "multi") control = qq.options.map((o) => h("label", { class: "opt" }, h("input", { type: "checkbox", checked: Array.isArray(v) && v.includes(o.id), onchange: (e) => { const s = new Set(Array.isArray(answers[qq.id]) ? answers[qq.id] : []); e.target.checked ? s.add(o.id) : s.delete(o.id); setAnswer([...s].sort((x, y) => x - y)); } }), o.text));
    else if (qq.type === "tf") control = [true, false].map((b) => h("label", { class: "opt" }, h("input", { type: "radio", name: "ans", checked: v === b, onchange: () => setAnswer(b) }), b ? "True" : "False"));
    else if (qq.type === "gap") control = h("input", { type: "text", value: v || "", maxlength: 200, autocomplete: "off", "aria-label": "Your answer", oninput: (e) => setAnswer(e.target.value) });
    else {
      const words = h("span", { class: "m" });
      const sync = (t) => { words.textContent = `${(t.trim().match(/\S+/g) || []).length} words`; };
      const ta = h("textarea", { style: "min-height:220px", maxlength: 12000, "aria-label": "Your answer", oninput: (e) => { setAnswer(e.target.value); sync(e.target.value); } }, v || "");
      sync(v || "");
      control = [ta, words];
    }
    const flagged = flags.has(qq.id);
    panel.replaceChildren(
      h("div", { style: "display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap" }, h("strong", null, `Question ${cur + 1} of ${qs.length}`), h("span", { class: "m" }, `${qq.marks} mark${qq.marks === 1 ? "" : "s"}. ${QLABEL[qq.type]}`)),
      h("div", { class: "qtext" }, qq.text), h("div", null, control),
      h("div", { class: "qnav" },
        h("button", { class: "btn line sm", type: "button", disabled: cur === 0, onclick: () => { cur--; keep(); drawQ(); } }, "Previous"),
        h("button", { class: `btn sm ${flagged ? "coral" : "line"}`, type: "button", "aria-pressed": flagged ? "true" : "false", onclick: () => { flagged ? flags.delete(qq.id) : flags.add(qq.id); keep(); drawQ(); } }, flagged ? "Flagged for review" : "Flag for review"),
        cur < qs.length - 1 ? h("button", { class: "btn sm", type: "button", onclick: () => { cur++; keep(); drawQ(); } }, "Next") : h("button", { class: "btn coral sm", type: "button", onclick: confirmSubmit }, "Review and submit")));
    drawNav();
    const first = panel.querySelector("input,textarea");
    if (first && qq.type !== "mcq" && qq.type !== "tf" && qq.type !== "multi") first.focus({ preventScroll: true });
  }
  async function save(keepalive = false) {
    if (!dirty || submitted || (saving && !keepalive)) return;
    const snapshot = { ...answers };
    dirty = false; saving = true;
    if (!keepalive) saveEl.textContent = "Saving";
    try {
      const r = await sapi("saveAnswers", { attemptId: ex.attemptId, answers: snapshot }, { keepalive });
      if (!keepalive) saveEl.textContent = `Saved ${new Date(r.savedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
    } catch (e) {
      dirty = true;

    } finally { saving = false; }
  }
  async function finish(auto) {
    if (submitted) return;
    submitted = true;
    clearInterval(tick); clearInterval(saver);
    panel.querySelectorAll("input,textarea,button").forEach((x) => { x.disabled = true; });
    submitBtn.disabled = true;
    saveEl.replaceChildren(h("span", { class: "spin" }), auto ? "Time is up. Submitting" : "Submitting");
    for (let tryNo = 0; ; tryNo++) {
      try {
        const res = await sapi("submitAttempt", { attemptId: ex.attemptId, answers, auto });
        try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
        memo.delete("assessments"); memo.delete("aboard");
        state.guard = null; cleanup();
        return resultView(res);
      } catch (e) {
        if (tryNo >= 5 || (e.status && e.status < 500 && e.status !== 429)) {
          submitted = false; submitBtn.disabled = false;
          saveEl.textContent = "";
          panel.prepend(h("div", { class: "msg error", role: "alert" }, `${e.message} Your answers are kept on this device. Press Submit to try again.`));
          panel.querySelectorAll("input,textarea,button").forEach((x) => { x.disabled = false; });

        }
        await new Promise((r) => setTimeout(r, 3000 * (tryNo + 1)));

    }
  }
  async function confirmSubmit() {
    const left = qs.filter((qq) => blank(answers[qq.id])).length, flagged = qs.filter((qq) => flags.has(qq.id)).length;
    const ok = await showModal({ title: "Submit your answers?", text: `${left ? `${left} question${left === 1 ? " is" : "s are"} not answered. ` : "Every question is answered. "}${flagged ? `${flagged} flagged for review. ` : ""}You cannot change your answers after submitting.`, actions: [{ label: "Keep working", value: false, cls: "line" }, { label: "Submit", value: true, cls: "coral" }] });
    if (ok) finish(false);
  }
  const paintTimer = () => {
    const r = remaining();
    timerEl.textContent = clock(r);
    timerEl.classList.toggle("low", r < 5 * 60 * 1000);
    if (!warned5 && r < 5 * 60 * 1000 && r > 60 * 1000) { warned5 = true; announce.textContent = "5 minutes left"; }
    if (!warned1 && r < 60 * 1000) { warned1 = true; announce.textContent = "1 minute left"; }
    if (r <= 0) finish(true);
  };
  const tick = setInterval(paintTimer, 1000);
  const saver = setInterval(() => save(), 15000);
  const onHide = () => { if (document.hidden) save(true); };
  const onLeave = (e) => { if (!submitted) { save(true); e.preventDefault(); e.returnValue = ""; } };
  document.addEventListener("visibilitychange", onHide);
  window.addEventListener("beforeunload", onLeave);
  const cleanup = () => { clearInterval(tick); clearInterval(saver); document.removeEventListener("visibilitychange", onHide); window.removeEventListener("beforeunload", onLeave); };
  state.teardown = () => { if (!submitted) save(true); cleanup(); };
  state.guard = async () => submitted || showModal({ title: "Leave the assessment?", text: "Your answers are saved. The timer keeps running while you are away, and the attempt is submitted when it ends.", actions: [{ label: "Stay", value: false, cls: "line" }, { label: "Leave", value: true, cls: "coral" }] });
  submitBtn.addEventListener("click", confirmSubmit);
  mount(h("div", { class: "exam-bar" }, h("div", { class: "grow" }, h("div", { class: "t" }, ex.title), saveEl), timerEl, submitBtn, announce),
    ex.attemptNo > 1 ? h("p", { class: "m", style: "margin:-6px 0 12px" }, `Attempt ${ex.attemptNo} of ${ex.maxAttempts}`) : null,
    h("div", { class: "exam" }, panel, h("aside", { class: "navgrid", "aria-label": "Questions" }, h("strong", null, "Questions"), cells, count,
      h("div", { class: "legend" }, h("span", null, "Dark: answered"), h("span", null, "Dot: flagged for review")))));
  paintTimer();
  if (!submitted) { drawQ(); if (dirty) save(); }
}

function resultView(r) {
  const back = link(`/dashboard/assessments/${r.assessmentId}`, "Back to the assessment", "crumb");
  if (r.inProgress) return mount(back, stateBox("This attempt is still open", "Go back and resume it."));
  if (!r.released) return mount(back, h("h1", null, r.title), h("p", { class: "sub" }, `${r.courseId}, attempt ${r.attemptNo}`), h("div", { class: "msg ok" }, r.message), r.autoSubmitted ? h("p", { class: "m" }, "This attempt was submitted automatically when time ran out.") : null, link("/dashboard/assessments", "All assessments", "btn line"));
  const say = (qq, v) => {
    if (blank(v)) return "No answer";
    if (qq.type === "mcq") return `${L8[v]}. ${qq.options[v]}`;
    if (qq.type === "multi") return v.map((i) => `${L8[i]}. ${qq.options[i]}`).join("\n");
    if (qq.type === "tf") return v ? "True" : "False";
    if (qq.type === "gap") return Array.isArray(v) ? v.join(" or ") : String(v);

  };
  mount(back, h("h1", null, r.title), h("p", { class: "sub" }, `${r.courseId}, attempt ${r.attemptNo}${r.autoSubmitted ? ", submitted when time ran out" : ""}`),
    h("div", { class: "score" }, h("b", null, `${r.pct}%`), h("div", null, h("div", { class: "t" }, `${r.score} of ${r.totalMarks} marks`), h("span", { class: `pill ${r.passed ? "ok" : "warn"}` }, r.passed ? "Passed" : `Pass mark is ${r.passMark}%`))),
    r.overallFeedback ? h("div", { class: "msg ok", style: "white-space:pre-wrap" }, h("strong", null, "Feedback: "), r.overallFeedback) : null,
    r.showsKey ? null : h("p", { class: "m" }, "Correct answers appear here once you have used all your attempts or the assessment has closed."),
    h("h2", null, "Your answers"),
    h("div", { class: "list" }, r.review.map((qq, i) => h("div", { class: "q" },
      h("div", { style: "display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap" }, h("strong", null, `Question ${i + 1}`), h("span", { class: `pill ${qq.earned === qq.marks ? "ok" : qq.earned > 0 ? "" : "warn"}` }, `${qq.earned ?? 0} of ${qq.marks}`)),
      h("p", { style: "white-space:pre-wrap;margin:8px 0" }, qq.text),
      h("div", { class: "m" }, "Your answer"), h("div", { class: "ans" }, say(qq, qq.yours)),
      r.showsKey && qq.type !== "theory" ? [h("div", { class: "m", style: "margin-top:8px" }, "Correct answer"), h("div", { class: "ans" }, say(qq, qq.answer))] : null,
      r.showsKey && qq.type === "theory" && qq.modelAnswer ? [h("div", { class: "m", style: "margin-top:8px" }, "What the markers looked for"), h("div", { class: "ans" }, qq.modelAnswer)] : null,
      qq.feedback ? h("div", { class: "why" }, h("strong", null, "Marker's note: "), qq.feedback) : null,
      r.showsKey && qq.explanation ? h("div", { class: "why" }, qq.explanation) : null))),
    h("div", { style: "margin-top:20px" }, link("/dashboard/assessments", "All assessments", "btn line")));
}

async function attemptPage(attemptId) {
  const r = await sapi("getAttempt", { attemptId });
  if (r.exam) return runExam(r.exam);
  resultView(r.result);

const SEARCH_MEMO = new Map();
async function ytSearch(q, pageToken) {
  const key = `${q}|${pageToken || ""}`;
  if (SEARCH_MEMO.has(key)) return SEARCH_MEMO.get(key);
  if (!WORKER_URL) { const e = new Error("not-configured"); e.code = "not-configured"; throw e; }
  const url = `${WORKER_URL}/youtube/search?q=${encodeURIComponent(q)}${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ""}`;
  let res = await fetch(url, { headers: { Authorization: `Bearer ${state.token}` } });
  if (res.status === 401) { state.token = await auth.currentUser.getIdToken(true); res = await fetch(url, { headers: { Authorization: `Bearer ${state.token}` } }); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "Search failed"); e.code = data.code || String(res.status); throw e; }
  SEARCH_MEMO.set(key, data);
  return data;
}

function playVideo(v) {
  const overlay = h("div", { class: "overlay", role: "dialog", "aria-modal": "true", "aria-label": v.title },
    h("div", { class: "modal wide" },
      h("div", { class: "vplayer" }, h("iframe", { src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0&modestbranding=1`, title: v.title, allow: "accelerometer; autoplay; encrypted-media; picture-in-picture", allowfullscreen: "true", referrerpolicy: "strict-origin-when-cross-origin" })),
      h("h3", { style: "font-size:18px" }, v.title),
      h("p", { style: "margin:0 0 6px" }, v.channel),
      h("div", { class: "acts" }, h("a", { class: "btn line sm", href: `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`, target: "_blank", rel: "noopener noreferrer" }, "Open on YouTube"),
        h("button", { class: "btn sm", type: "button", onclick: () => close() }, "Close"))));
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
  document.body.append(overlay);
}

async function explore() {
  const params = new URLSearchParams(location.search);
  let q = (params.get("q") || "").trim(), token = params.get("t") || "", pageNo = Math.max(1, Number(params.get("n")) || 1);
  const input = h("input", { type: "search", name: "q", placeholder: "Search a topic, for example fluid mechanics", maxlength: "100", value: q, "aria-label": "Search YouTube videos", autocomplete: "off", enterkeyhint: "search" });
  const results = h("div", { "aria-live": "polite" });
  const form = h("form", { class: "search", role: "search" }, input, h("button", { class: "btn coral", type: "submit" }, "Search"));
  const sync = () => history.replaceState({}, "", q ? `/dashboard/explore?q=${encodeURIComponent(q)}${token ? `&t=${encodeURIComponent(token)}&n=${pageNo}` : ""}` : "/dashboard/explore");
  const skeleton = () => h("div", { class: "vgrid" }, Array.from({ length: 10 }, () => h("div", { class: "sk", style: "aspect-ratio:16/12" })));
  const card = (v) => h("button", { class: "vcard", type: "button", onclick: () => playVideo(v) },
    h("div", { class: "vthumb" }, h("img", { src: v.thumb, alt: "", loading: "lazy", width: "320", height: "180" })),
    h("div", { class: "vbody" }, h("div", { class: "vtitle" }, v.title), h("div", { class: "m" }, v.channel)));
  let seq = 0;
  async function load() {
    const mine = ++seq;
    sync();
    if (!q) { results.replaceChildren(h("div", { class: "empty" }, "Search for a topic to find videos that explain it.")); return; }
    results.replaceChildren(skeleton());
    try {
      const data = await ytSearch(q, token);
      if (mine !== seq) return;
      if (!data.items.length) { results.replaceChildren(h("div", { class: "empty" }, `No videos found for "${q}". Try different words.`)); return; }
      results.replaceChildren(h("div", { class: "vgrid" }, data.items.map(card)),
        h("nav", { class: "pager", "aria-label": "Search results pages" },
          h("button", { class: "btn line sm", type: "button", disabled: !data.prevPageToken && pageNo === 1, onclick: () => { token = data.prevPageToken || ""; pageNo = Math.max(1, pageNo - 1); load(); window.scrollTo({ top: 0, behavior: "smooth" }); } }, "Previous"),
          h("span", null, `Page ${pageNo}`),
          h("button", { class: "btn line sm", type: "button", disabled: !data.nextPageToken, onclick: () => { token = data.nextPageToken; pageNo += 1; load(); window.scrollTo({ top: 0, behavior: "smooth" }); } }, "Next")));
    } catch (e) {
      if (mine !== seq) return;
      const notSet = e.code === "not-configured" || e.code === "not_configured";
      const msg = notSet ? ["Video search is not set up yet", "The Technical Admin needs to finish connecting the search service."]
        : e.code === "unauthorized" || e.code === "401" ? ["Please sign in again", "Your session has expired. Sign out and sign back in to search videos."]
        : e.code === "unverified" ? ["Verify your email first", "Video search is available once your email address is verified."]
        : e.code === "rate_limited" || e.code === "429" ? ["Too many searches", "Please wait a minute and try again."]
        : e.code === "quota_exceeded" ? ["Search is resting for today", "The daily search limit has been reached. It resets every day, so please try again tomorrow."]
        : ["Could not load videos", "Check your connection and try again."];
      results.replaceChildren(stateBox(msg[0], msg[1], notSet || e.code === "quota_exceeded" || e.code === "unauthorized" || e.code === "401" || e.code === "unverified" ? null : h("button", { class: "btn", type: "button", onclick: load }, "Try again")));
    }
  }
  form.addEventListener("submit", (e) => { e.preventDefault(); const next = input.value.trim(); if (!next) return; q = next; token = ""; pageNo = 1; load(); });
  mount(h("div", { class: "top" }, h("div", null, h("h1", null, "Explore videos"), h("p", { class: "sub" }, "Search YouTube for extra explanations of anything you are studying."))), form, results);
  await load();
}

const routes = [
  [/^\/dashboard$/, home, "home"], [/^\/dashboard\/register$/, register, "courses"], [/^\/dashboard\/courses$/, courses, "courses"],
  [/^\/dashboard\/courses\/([^/]+)$/, course, "courses"], [/^\/dashboard\/lesson\/([^/]+)$/, lesson, "courses"],
  [/^\/dashboard\/assessments$/, assessmentsList, "assessments"], [/^\/dashboard\/assessments\/([^/]+)$/, assessmentDetail, "assessments"], [/^\/dashboard\/result\/([^/]+)$/, attemptPage, "assessments"],
  [/^\/dashboard\/explore$/, explore, "explore"], [/^\/dashboard\/leaderboard$/, leaderboard, "leaderboard"], [/^\/dashboard\/notices$/, notices, "notices"], [/^\/dashboard\/profile$/, profile, "profile"]
];

async function route() {
  if (state.teardown) { state.teardown(); state.teardown = null; }
  state.guard = null;
  const path = location.pathname.replace(/(.)\/$/, "$1");
  const match = routes.map(([re, fn, nav]) => [re.exec(path), fn, nav]).find(([m]) => m);
  document.querySelectorAll("[data-nav]").forEach((a) => (a.dataset.nav === (match ? match[2] : "") ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  if (!match) return mount(stateBox("Page not found", "That page does not exist.", link("/dashboard", "Go home")));
  const wait = setTimeout(() => mount(h("div", null, h("div", { class: "sk", style: "height:140px;border-radius:20px;margin-bottom:16px" }), h("div", { class: "sk", style: "height:72px;margin-bottom:12px" }), h("div", { class: "sk", style: "height:72px" }))), 160);
  window.scrollTo(0, 0);
  try { await match[1](...match[0].slice(1)); clearTimeout(wait); }
  catch (e) {
    clearTimeout(wait);
    console.error(e);
    const denied = e.code === "permission-denied";
    mount(stateBox(denied ? "You do not have access" : "Something went wrong", denied ? "Register for this course to open its lessons." : "Check your connection and try again.",
      denied ? link("/dashboard/register", "Register courses", "btn coral") : h("button", { class: "btn", type: "button", onclick: route }, "Try again")));
  }
}

async function navigate(path) {
  if (state.guard && !(await state.guard())) return; // an assessment is in progress
  state.guard = null;
  history.pushState({}, "", path); route();
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); navigate(a.getAttribute("href"));
});
window.addEventListener("popstate", route);
document.getElementById("signout").addEventListener("click", confirmSignOut);

function watchForUpdates(reg) {
  const announce = (worker) => {
    const banner = h("div", { class: "banner" }, "A new version of MLMS is ready.", h("button", { type: "button", onclick: () => worker.postMessage("SKIP_WAITING") }, "Update"));
    document.body.append(banner);
  };
  if (reg.waiting && navigator.serviceWorker.controller) announce(reg.waiting);
  reg.addEventListener("updatefound", () => {
    const worker = reg.installing;
    worker.addEventListener("statechange", () => { if (worker.state === "installed" && navigator.serviceWorker.controller) announce(worker); });
  });
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").then(watchForUpdates).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
}

const STAFF_PORTAL = { general: "/admin-portal", course_lead: "/admin-portal", comms: "/admin-portal", tech_admin: "/technical-portal" };
onAuthStateChanged(auth, async (user) => {
  if (!user) { clearHint(); return location.replace("/auth/login"); }
  if (!user.emailVerified) { try { await user.reload(); } catch (e) {} }
  if (!user.emailVerified) return location.replace("/auth/verify-email");
  try {
    const tr = await user.getIdTokenResult(); // served from cache, no network round trip unless expired
    const portal = STAFF_PORTAL[tr.claims.role];
    if (portal) { setHint(tr.claims.role); return location.replace(portal); }
    if (Date.now() - Number(tr.claims.auth_time) * 1000 > SESSION_DAYS * DAY) { clearHint(); await signOut(auth); return location.replace("/auth/login"); }
    state.user = user; state.token = tr.token;
    const cachedCore = readCore();
    const profileP = getDoc(doc(db, "users", user.uid));
    const coreP = cachedCore ? Promise.resolve(cachedCore) : fetchCore();
    const snap = await profileP;
    if (!snap.exists() || !profileComplete(snap.data()) || !(await ownsMatric(user.uid, snap.data().matricNo))) return location.replace("/auth/complete-profile");
    state.profile = snap.data();
    setHint("student");
    applyCore(await coreP);
    await route();
    setInterval(async () => { state.token = await user.getIdToken(); }, 30 * 60 * 1000);
    // Revalidate in the background; re-render only if registrations or term actually changed.
    const fresh = cachedCore ? fetchCore() : Promise.resolve(null);
    const [latest] = await Promise.all([fresh, loadNotices()]);
    if (latest && JSON.stringify(pack(latest)) !== JSON.stringify(pack(cachedCore))) { applyCore(latest); if (!/\/(lesson|register|result|assessments)\b/.test(location.pathname)) route(); }
    if (state.regs.length) myAssessments().then((d) => paintOpenBadge(d.items)).catch(() => {});
    if (!/\/result\//.test(location.pathname)) showUnreadPopups();
  } catch (e) {
    console.error(e);
    mount(stateBox("Could not load your dashboard", "Check your connection and try again.", h("button", { class: "btn", type: "button", onclick: () => location.reload() }, "Reload")));
  }
});
